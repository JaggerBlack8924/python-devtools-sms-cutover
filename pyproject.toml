[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools-sms"
version = "0.1.0"
description = "Typed developer-tools SMS campaign service"
requires-python = ">=3.10"
dependencies = ["requests>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["devtools_sms"]
